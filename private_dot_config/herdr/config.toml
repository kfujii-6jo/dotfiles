onboarding = false

[keys]
prefix = "ctrl+s"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

resize_mode = "prefix+r"
copy_mode = "prefix+v"
edit_scrollback = ""

split_horizontal = "prefix+minus"
split_vertical = "prefix+="
close_pane = "prefix+x"

# Navigate through agents instead of tabs. Empty bindings disable defaults.
new_tab = ""
close_tab = ""
rename_tab = ""
next_tab = ""
previous_tab = ""
switch_tab = ""
move_tab_previous = ""
move_tab_next = ""

cycle_pane_next = ""
cycle_pane_previous = ""

next_agent = "prefix+]"
previous_agent = "prefix+["
focus_agent = "prefix+1..9"

workspace_picker = "prefix+f"
# Use Vim keys to select workspaces in Navigate mode.
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]
navigate_pane_down = ""
navigate_pane_up = ""
next_workspace = "prefix+n"
previous_workspace = "prefix+p"
goto = ""

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "exec \"$HOME/.config/herdr/read-scrollback.sh\""
description = "read pane scrollback in Neovim"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "exec \"$HOME/.config/herdr/repo-space.sh\""
description = "search repositories and open a new Space"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "claude"
width = "80%"
height = "80%"

[ui]
hide_tab_bar_when_single_tab = true
