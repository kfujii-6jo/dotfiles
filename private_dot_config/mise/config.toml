[settings]
npm.package_manager = "npm"

[tools]
# Languages & Runtimes
go = "1.27.3"
node = "26.12.1"
python = "3.15.1"
rust = "1.99.1"
bun = "1.4.4"
"npm:typescript" = "latest"

# Package Managers
uv = "latest"
"npm:pnpm" = "latest"

# Dotfiles
chezmoi = "latest"
"pipx:apm-cli" = "0.33.0"

# Coding Agents
"npm:@earendil-works/pi-coding-agent" = { version = "latest", allow_builds = ["@google/genai", "protobufjs"] }
"github:can1357/oh-my-pi" = "18.10.3"
"npm:takt" = { version = "latest", allow_builds = ["takt", "protobufjs"] }

# Oxc Development
just = "latest"
cmake = "latest"
watchexec = "latest"
cargo-insta = "latest"
typos = "latest"
"cargo:cargo-shear" = "1.13.1"

# Development Workflow
"go:github.com/kfujii-6jo/gev/cmd/gev" = "path:{{env.HOME}}/.local/share/gev"
# bd downloads its native binary in postinstall.
"npm:@beads/bd" = { version = "latest", allow_builds = ["@beads/bd"] }
"npm:@fission-ai/openspec" = "latest"

# Git
gh = "latest"
ghq = "latest"
delta = "latest"
lazygit = "latest"
"go:github.com/k1LoW/git-wt" = "latest"

# Search & Files
fzf = "latest"
ripgrep = "latest"
bat = "latest"

# Cloud
gcloud = "latest"

# Formatters & Parsers
stylua = "latest"
tree-sitter = "latest"

# Language Servers (nvim-dev native LSP)
"npm:pyright" = "latest"
"npm:typescript-language-server" = "latest"
lua-language-server = "latest"
rust-analyzer = "latest"
"go:golang.org/x/tools/gopls" = "latest"
